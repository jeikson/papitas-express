<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Papitas Express — Pedidos</title>
  <meta name="theme-color" content="#f7b733">
  <meta name="description" content="Pide tus papitas cargadas a domicilio o para recoger. El pedido llega directo al WhatsApp de la tienda.">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="top">
    <div class="top__brand">
      <img src="assets/img/logo-420.png" alt="Papitas Express" class="top__logo">
      <div class="top__txt">
        <strong data-negocio>Papitas Express</strong>
        <small><span class="dot" id="dot"></span> <span id="estado">Cargando…</span></small>
      </div>
    </div>
    <button class="cartbtn" id="btnCart" aria-label="Ver mi pedido">
      <span aria-hidden="true">🛒</span>
      <b id="cartCount">0</b>
    </button>
  </header>

  <div class="aviso" id="aviso" hidden></div>

  <main class="wrap">
    <div class="hero">
      <h1>¿Qué estación te llevas hoy?</h1>
      <p data-eslogan>Donde el viaje inicia con sabor</p>
    </div>

    <div class="buscar" id="buscadorWrap">
      <input type="search" id="buscar" placeholder="Buscar en el menú…" autocomplete="off" aria-label="Buscar productos">
    </div>

    <nav class="chips" id="chips" aria-label="Categorías"></nav>
    <section class="grid" id="grid"></section>
    <p class="vacio" id="vacio" hidden>No encontramos productos con ese nombre.</p>

    <footer class="pie">
      <img src="assets/img/logo-160.png" alt="" class="pie__logo">
      <p>
        <strong data-negocio>Papitas Express</strong> · <span data-ciudad>Cartagena</span><br>
        Pedidos al WhatsApp <span data-tel>—</span>
      </p>
      <p class="pie__nota">Tu pedido se envía como mensaje de WhatsApp a la tienda. Nos confirmamos por ahí mismo.</p>
    </footer>
  </main>

  <div class="barra" id="barra" hidden>
    <div class="barra__tot">
      <small id="barraItems">0 productos</small>
      <strong id="barraTotal">$ 0</strong>
    </div>
    <button class="btn btn--primary" id="barraBtn">Ver mi pedido</button>
  </div>

  <div class="overlay" id="overlay" hidden></div>

  <!-- Ficha de producto -->
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Detalle del producto">
    <div class="sheet__grip"></div>
    <div class="sheet__body" id="sheetBody"></div>
    <footer class="sheet__foot" id="sheetFoot" hidden></footer>
  </section>

  <!-- Carrito / checkout -->
  <section class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-label="Mi pedido">
    <header class="drawer__head">
      <button class="iconbtn" id="drawerBack" hidden aria-label="Volver">←</button>
      <h2 id="drawerTitle">Mi pedido</h2>
      <button class="iconbtn" id="drawerClose" aria-label="Cerrar">✕</button>
    </header>
    <div class="drawer__body" id="drawerBody"></div>
    <footer class="drawer__foot" id="drawerFoot" hidden></footer>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
